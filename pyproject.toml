[project]
name = "video-duplicate"
version = "1.0.1"
description = "Find duplicate videos across folders"
readme = "README.md"
authors = [{ name = "ritonun", email = "you@example.com" }]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "pyacoustid>=1.3.1",
    "typer>=0.27.3",
    "videohash>=3.0.1",
]

[project.scripts]
video-duplicate = "video_duplicate.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
